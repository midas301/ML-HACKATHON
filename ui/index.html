<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PathSnap Evaluator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f5f7; color: #1d2433; }
  header { padding: 12px 20px; background: #1d2433; color: #fff; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header input { width: 260px; padding: 6px 8px; border-radius: 4px; border: none; }
  header button { padding: 6px 12px; border: none; border-radius: 4px; background: #4f8cff; color: #fff; cursor: pointer; }
  #status { font-size: 13px; opacity: .85; }
  main { display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 56px); }
  aside { overflow-y: auto; padding: 14px; border-right: 1px solid #dde1e7; background: #fff; }
  aside h2 { font-size: 14px; margin: 6px 0 10px; text-transform: uppercase; letter-spacing: .05em; color: #5b6475; }
  .trip { display: block; width: 100%; text-align: left; padding: 9px 10px; margin-bottom: 6px; border: 1px solid #dde1e7; border-radius: 6px; background: #fafbfc; cursor: pointer; font-size: 14px; }
  .trip:hover { background: #eef3ff; }
  .trip.active { background: #4f8cff; color: #fff; border-color: #4f8cff; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  td { padding: 4px 2px; border-bottom: 1px solid #eef0f3; }
  td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
  #map { height: 100%; }
  .legend { background: #fff; padding: 8px 10px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.2); font-size: 13px; line-height: 1.6; }
  .sw { display: inline-block; width: 18px; height: 4px; margin-right: 6px; vertical-align: middle; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 11px 0 5px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>PathSnap evaluator</h1>
  <label>API <input id="api" value="http://127.0.0.1:8000"></label>
  <button id="connect">Load trips</button>
  <span id="status">Not connected</span>
</header>
<main>
  <aside>
    <h2>Evaluation trips</h2>
    <div id="trips"></div>
    <h2 style="margin-top:18px">Results</h2>
    <div id="results"><em>Select a trip.</em></div>
  </aside>
  <div id="map"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map("map").setView([52.95, -1.15], 12);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
const gpsLayer = L.layerGroup().addTo(map);
const routeLayer = L.layerGroup().addTo(map);
const snapLayer = L.layerGroup();
L.control.layers(null, { "Raw GPS": gpsLayer, "Predicted route": routeLayer, "Snapped points": snapLayer }).addTo(map);
const legend = L.control({ position: "bottomright" });
legend.onAdd = () => {
  const d = L.DomUtil.create("div", "legend");
  d.innerHTML = '<div><span class="dot" style="background:#1f6feb"></span>Raw GPS</div>' +
    '<div><span class="sw" style="background:#e5383b"></span>Predicted route (HMM)</div>' +
    '<div><span class="dot" style="background:#2a9d8f"></span>Snapped points</div>';
  return d;
};
legend.addTo(map);

const $ = (id) => document.getElementById(id);
const api = () => $("api").value.replace(/\/$/, "");
const fmt = (v) => v === null || v === undefined ? "n/a" : (typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(4)) : v);

async function loadTrips() {
  $("status").textContent = "Connecting...";
  try {
    const r = await fetch(api() + "/trips");
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    $("trips").innerHTML = "";
    data.trips.forEach((t) => {
      const b = document.createElement("button");
      b.className = "trip"; b.textContent = "Trip " + t; b.dataset.id = t;
      b.onclick = () => predict(t, b);
      $("trips").appendChild(b);
    });
    $("status").textContent = `Connected: ${data.trips.length} trips`;
  } catch (e) {
    $("status").textContent = "Error: " + e.message;
  }
}

async function predict(id, btn) {
  document.querySelectorAll(".trip").forEach((b) => b.classList.remove("active"));
  btn.classList.add("active");
  $("results").innerHTML = "<em>Running pipeline on server...</em>";
  $("status").textContent = `POST /predict ${id}`;
  try {
    const r = await fetch(api() + "/predict", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ trip_id: id }) });
    if (!r.ok) throw new Error(await r.text());
    const d = await r.json();
    draw(d);
    $("status").textContent = `Trip ${id} done in ${d.timings_s.total_inference_s}s`;
  } catch (e) {
    $("results").innerHTML = "<b>Error:</b> " + e.message;
    $("status").textContent = "Error";
  }
}

function draw(d) {
  gpsLayer.clearLayers(); routeLayer.clearLayers(); snapLayer.clearLayers();
  const step = Math.max(1, Math.floor(d.gps.length / 1500));
  d.gps.forEach((p, i) => { if (i % step === 0) L.circleMarker(p, { radius: 2, color: "#1f6feb", weight: 1, fillOpacity: 0.8 }).addTo(gpsLayer); });
  d.snapped_points.forEach((p, i) => { if (p && i % step === 0) L.circleMarker(p, { radius: 2, color: "#2a9d8f", weight: 1, fillOpacity: 0.9 }).addTo(snapLayer); });
  const line = L.polyline(d.predicted_route, { color: "#e5383b", weight: 4, opacity: 0.85 }).addTo(routeLayer);
  L.marker(d.gps[0]).bindPopup("Start").addTo(gpsLayer);
  L.marker(d.gps[d.gps.length - 1]).bindPopup("End").addTo(gpsLayer);
  map.fitBounds(L.latLngBounds(d.gps).extend(line.getBounds()), { padding: [20, 20] });
  const m = d.metrics || {};
  const rows = [
    ["GPS points", d.n_points],
    ["Scored points", m.scored_points],
    ["Top-1 accuracy (HMM)", m.hmm_top1_accuracy],
    ["Top-1 accuracy (classifier only)", m.clf_top1_accuracy],
    ["Route continuity (HMM)", m.hmm_route_continuity],
    ["Route continuity (classifier only)", m.clf_route_continuity],
    ["Route arc precision (HMM)", m.hmm_route_precision],
    ["Route arc recall (HMM)", m.hmm_route_recall],
    ["Route arc F1 (HMM)", m.hmm_route_f1],
    ["Route length recall", m.route_length_overlap_recall],
    ["Route length precision", m.route_length_overlap_precision],
    ["Candidate miss rate", m.candidate_miss_rate],
    ["Viterbi breaks", d.viterbi_breaks],
    ["Predicted route arcs", d.predicted_route_arcs.length],
    ["Inference time (s)", d.timings_s.total_inference_s],
  ];
  $("results").innerHTML = "<table>" + rows.map(([k, v]) => `<tr><td>${k}</td><td>${fmt(v)}</td></tr>`).join("") + "</table>";
}

$("connect").onclick = loadTrips;
const q = new URLSearchParams(location.search).get("api");
if (q) $("api").value = q;
</script>
</body>
</html>
